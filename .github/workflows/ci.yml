name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.db }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (${{ matrix.db }})
        run: npx vitest run
        env:
          MORROW_TEST_DB: ${{ matrix.db }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test the built CLI
        run: |
          node apps/cli/dist/bin.js --version
          DATABASE_URL=sqlite:./ci.db node apps/cli/dist/bin.js migrate
          DATABASE_URL=sqlite:./ci.db node apps/cli/dist/bin.js seed --demo
          DATABASE_URL=sqlite:./ci.db node apps/cli/dist/bin.js doctor || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: morrow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
